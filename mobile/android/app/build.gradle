plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'org.tochat.app'
    compileSdk 35
    ndkVersion '27.1.12297006'
    defaultConfig {
        applicationId 'org.tochat.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.1.2'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release'; cppFlags '-std=c++17' } }
    }
    externalNativeBuild { cmake { path '../../../native/toxbridge/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildTypes { release { minifyEnabled false } }
}
